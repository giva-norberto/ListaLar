name: Corrigir importador NFC-e 1.3.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-importador-1-3-3.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção do parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          arquivo = Path('importar-nota-pdf.js')
          texto = arquivo.read_text(encoding='utf-8')

          texto = texto.replace('Versão: 1.3.2', 'Versão: 1.3.3', 1)
          texto = texto.replace('const VERSAO = "1.3.2";', 'const VERSAO = "1.3.3";', 1)

          antigo = '''        const valorEfetivo = valorPago > 0
            ? valorPago
            : valorProdutos;

        return {'''
          novo = '''        const valorEfetivo = valorPago > 0
            ? valorPago
            : valorProdutos;

        const itensExtraidos =
            extrairItensSEFMG(linhas);

        const quantidadeDeclarada =
            extrairQuantidadeTotal(texto);

        return {'''
          if antigo not in texto:
              raise SystemExit('Não encontrou bloco de preparação da nota.')
          texto = texto.replace(antigo, novo, 1)

          antigo = '''            quantidadeTotalItens:
                extrairQuantidadeTotal(texto),'''
          novo = '''            // No portal SEF/MG, "Qtde total de itens" pode representar
            // a soma das unidades (ex.: 2 + 1 + 2 = 5), enquanto o cupom
            // considera as três linhas de produto. Para o ListaLar usamos
            // a quantidade de linhas/produtos já consolidadas pelo parser.
            quantidadeTotalItens:
                itensExtraidos.length || quantidadeDeclarada,

            quantidadeTotalUnidadesDeclarada:
                quantidadeDeclarada,'''
          if antigo not in texto:
              raise SystemExit('Não encontrou quantidadeTotalItens.')
          texto = texto.replace(antigo, novo, 1)

          antigo = '''            itens:
                extrairItensSEFMG(linhas),'''
          novo = '''            itens:
                itensExtraidos,'''
          if antigo not in texto:
              raise SystemExit('Não encontrou atribuição de itens.')
          texto = texto.replace(antigo, novo, 1)

          inicio = texto.find('    function extrairItensSEFMG(linhas) {')
          fim = texto.find('    function extrairItensTabelaSEFMG(linhas) {', inicio)
          if inicio < 0 or fim < 0:
              raise SystemExit('Não encontrou funções de extração de itens.')

          nova_funcao = r'''    function extrairItensSEFMG(linhas) {
        /*
         * O PDF da SEF/MG varia bastante na distribuição das colunas.
         * A versão anterior retornava imediatamente quando o extrator de
         * tabela encontrava ao menos um item. Em algumas notas isso fazia
         * o ListaLar aceitar apenas 1 item, embora outros extratores fossem
         * capazes de encontrar o restante.
         *
         * Agora executamos as três estratégias, escolhemos a que encontrou
         * mais linhas reais e, por fim, consolidamos códigos repetidos.
         */

        const candidatos = [];

        const itensTabela =
            extrairItensTabelaSEFMG(linhas);
        candidatos.push(itensTabela);

        const itensPadrao = [];
        const textoUnificado =
            linhas.join("\n");

        const padraoItem =
            /(.+?)\s*\(C[oó]digo:\s*(\d+)\)\s*Qtde total de [ií]tens:\s*([\d.,]+)\s*UN:\s*([A-Za-zÀ-ÿ]+)\s*Valor total R\$:\s*R?\$?\s*([\d.,]+)/gi;

        let correspondencia;

        while (
            (
                correspondencia =
                    padraoItem.exec(textoUnificado)
            ) !== null
        ) {
            const descricaoBruta =
                correspondencia[1]
                    .split("\n")
                    .pop()
                    .trim();

            const item = criarItemInterpretado({
                descricao: descricaoBruta,
                codigo: correspondencia[2],
                quantidade: correspondencia[3],
                unidade: correspondencia[4],
                valorTotal: correspondencia[5]
            });

            if (item) {
                itensPadrao.push(item);
            }
        }

        candidatos.push(itensPadrao);
        candidatos.push(
            extrairItensPorLinhas(linhas)
        );

        const melhor = candidatos
            .sort(
                (a, b) => b.length - a.length
            )[0] || [];

        return agruparItensIguaisNota(melhor);
    }

    function agruparItensIguaisNota(itens) {
        const mapa = new Map();

        for (const item of itens || []) {
            const codigo =
                somenteDigitos(item?.codigo || "");

            const chave = codigo
                ? `codigo:${codigo}`
                : [
                    normalizarParaComparacao(
                        item?.descricaoOriginal ||
                        item?.produtoNome ||
                        ""
                    ),
                    String(item?.unidade || "UN")
                        .toUpperCase()
                ].join("|");

            if (!mapa.has(chave)) {
                mapa.set(chave, {
                    ...item,
                    quantidade:
                        converterNumero(item?.quantidade),
                    precoTotal:
                        arredondarMoeda(
                            converterMoeda(item?.precoTotal)
                        )
                });
                continue;
            }

            const atual = mapa.get(chave);

            atual.quantidade =
                converterNumero(atual.quantidade) +
                converterNumero(item?.quantidade);

            atual.precoTotal =
                arredondarMoeda(
                    converterMoeda(atual.precoTotal) +
                    converterMoeda(item?.precoTotal)
                );

            atual.precoUnitario =
                atual.quantidade > 0
                    ? arredondarMoeda(
                        atual.precoTotal /
                        atual.quantidade
                    )
                    : atual.precoTotal;
        }

        return [...mapa.values()];
    }

'''
          texto = texto[:inicio] + nova_funcao + texto[fim:]

          if 'const VERSAO = "1.3.3";' not in texto:
              raise SystemExit('Versão 1.3.3 não aplicada.')

          arquivo.write_text(texto, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html_novo = html.replace(
              './importar-nota-pdf.js?v=1.3.2',
              './importar-nota-pdf.js?v=1.3.3',
              1
          )
          if html_novo == html:
              raise SystemExit('Não encontrou referência 1.3.2 no index.html.')
          index.write_text(html_novo, encoding='utf-8')

          versao = Path('version.json')
          dados = json.loads(versao.read_text(encoding='utf-8'))
          dados['version'] = '1.0.29'
          dados['updatedAt'] = '2026-08-18'
          dados['notes'] = 'Corrige importação de NFC-e com produtos repetidos e quantidades consolidadas'
          versao.write_text(
              json.dumps(dados, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Validar JavaScript
        run: |
          node --check importar-nota-pdf.js
          grep -q 'const VERSAO = "1.3.3";' importar-nota-pdf.js
          grep -q 'importar-nota-pdf.js?v=1.3.3' index.html

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "ListaLar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add importar-nota-pdf.js index.html version.json
          git commit -m "Corrige importador NFC-e 1.3.3"
          git push
