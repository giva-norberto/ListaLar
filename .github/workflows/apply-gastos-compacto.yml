name: Atualizar modulo Gastos com filtro mensal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-gastos-compacto.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar filtro mensal
        run: python3 .github/scripts/aplicar_filtro_mensal_gastos.py

      - name: Validar arquivos
        shell: bash
        run: |
          node --check gastos.js
          grep -q 'const VERSAO = "3.3.0"' gastos.js
          grep -q 'function atualizarSeletorMeses()' gastos.js
          grep -q 'Todos os meses' gastos.js
          grep -q 'gastos.js?v=3.3.0' index.html
          grep -q '"version": "1.0.28"' version.json

      - name: Commit e push
        shell: bash
        run: |
          git config user.name 'ListaLar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gastos.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git commit -m 'Adiciona filtro mensal ao Gastos 3.3.0'
          git push origin HEAD:main
