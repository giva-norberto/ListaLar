name: Aplicar historico compacto de gastos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gastos-compacto.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar versao 3.2.2
        run: python3 .github/scripts/apply_gastos_compacto.py

      - name: Validar sintaxe
        run: node --check gastos.js

      - name: Validar layout compacto
        shell: bash
        run: |
          grep -q 'const VERSAO = "3.2.2";' gastos.js
          grep -q 'listalar-gastos-registro-topo' gastos.js
          grep -q 'listalar-gastos-registro-data' gastos.js
          grep -q 'listalar-gastos-registro-quantidade' gastos.js

      - name: Commit e push
        shell: bash
        run: |
          if git diff --quiet -- gastos.js; then
            echo 'Nenhuma alteracao pendente.'
            exit 0
          fi
          git config user.name 'ListaLar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gastos.js
          git commit -m 'Atualiza gastos para historico compacto 3.2.2'
          git push origin HEAD:main
