name: Corrigir cards de gastos no celular

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-gastos-compacto.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        run: python3 .github/scripts/fix_gastos_mobile.py

      - name: Validar JavaScript
        run: node --check gastos.js

      - name: Commit e push
        run: |
          git config user.name 'ListaLar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gastos.js version.json
          git commit -m 'Corrige layout dos cards de gastos no celular'
          git push origin HEAD:main
