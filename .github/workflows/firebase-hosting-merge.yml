                const bloco = itensPagina.filter((item) => {
                    const y = Number(item?.y);
                    return y <= limiteSuperior && y > limiteInferior;
                });

                const descricaoTexto = bloco
                    .filter((item) => Number(item.x) < xQtde - 8)
