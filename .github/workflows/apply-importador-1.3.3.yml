name: Corrigir importador PDF 1.3.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-importador-1.3.3.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção do parser
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('importar-nota-pdf.js')
          texto = path.read_text(encoding='utf-8')

          texto = texto.replace('Versão: 1.3.2', 'Versão: 1.3.3', 1)
          texto = texto.replace('const VERSAO = "1.3.2";', 'const VERSAO = "1.3.3";', 1)

          antigo = '''        const itensTabela =
            extrairItensTabelaSEFMG(linhas);

        if (itensTabela.length) {
            // Cada linha da NFC-e representa um item comprado.
            // Não remover duplicados: produtos iguais podem aparecer
            // várias vezes na mesma nota e contam no total oficial.
            return itensTabela;
        }

        const itens = [];'''

          novo = '''        const candidatos = [
            extrairItensTabelaSEFMG(linhas),
            extrairItensPorBlocosCodigoSEFMG(linhas)
        ];

        // O PDF da SEF/MG varia a quebra de colunas conforme o produto.
        // Usa a estratégia que recuperar a maior quantidade de linhas reais,
        // preservando ocorrências repetidas da mesma mercadoria.
        const melhorCandidato = candidatos
            .sort((a, b) => b.length - a.length)[0] || [];

        if (melhorCandidato.length) {
            return melhorCandidato;
        }

        const itens = [];'''

          if antigo not in texto:
              raise SystemExit('Trecho principal do parser não encontrado.')
          texto = texto.replace(antigo, novo, 1)

          marcador = '    function extrairItensTabelaSEFMG(linhas) {'
          if marcador not in texto:
              raise SystemExit('Ponto de inserção não encontrado.')

          fallback = r'''    function extrairItensPorBlocosCodigoSEFMG(linhas) {
        const itens = [];
        const inicios = [];

        for (let indice = 0; indice < linhas.length; indice += 1) {
            if (/\(C[oó]digo\s*:/i.test(linhas[indice])) {
                inicios.push(indice);
            }
        }

        for (let posicao = 0; posicao < inicios.length; posicao += 1) {
            const inicio = inicios[posicao];
            const fim = posicao + 1 < inicios.length
                ? inicios[posicao + 1]
                : Math.min(linhas.length, inicio + 14);

            const blocoLinhas = linhas.slice(inicio, fim);
            const bloco = blocoLinhas.join(" ")
                .replace(/\s+/g, " ")
                .trim();

            const codigoMatch = bloco.match(
                /\(C[oó]digo\s*:\s*(\d+)\s*\)/i
            );

            if (!codigoMatch) {
                continue;
            }

            const descricao = bloco
                .slice(0, codigoMatch.index)
                .trim();

            const depoisCodigo = bloco.slice(
                codigoMatch.index + codigoMatch[0].length
            );

            const quantidadeMatch = depoisCodigo.match(
                /Qtde total de [ií]tens\s*:\s*([\d.,]+)/i
            );

            const unidadeMatch = depoisCodigo.match(
                /UN\s*:\s*([A-Za-zÀ-ÿ]{1,10})(?=\s|Valor|$)/i
            );

            const valorMatch = depoisCodigo.match(
                /Valor total R\$\s*:\s*(?:R\$\s*)?([\d.,]+)/i
            );

            if (!quantidadeMatch || !valorMatch) {
                continue;
            }

            const item = criarItemInterpretado({
                descricao,
                codigo: codigoMatch[1],
                quantidade: quantidadeMatch[1],
                unidade: unidadeMatch?.[1] || "UN",
                valorTotal: valorMatch[1]
            });

            if (item) {
                itens.push(item);
            }
        }

        return itens;
    }

'''
          texto = texto.replace(marcador, fallback + marcador, 1)
          path.write_text(texto, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, qtd = re.subn(
              r'importar-nota-pdf\.js\?v=\d+\.\d+\.\d+',
              'importar-nota-pdf.js?v=1.3.3',
              html,
              count=1
          )
          if qtd != 1:
              raise SystemExit('Referência do importador no index não encontrada.')
          index.write_text(html, encoding='utf-8')

          version = Path('version.json')
          if version.exists():
              conteudo = version.read_text(encoding='utf-8')
              conteudo = re.sub(r'"version"\s*:\s*"[^"]+"', '"version": "1.0.29"', conteudo, count=1)
              conteudo = re.sub(r'"updatedAt"\s*:\s*"[^"]+"', '"updatedAt": "2026-08-18"', conteudo, count=1)
              conteudo = re.sub(r'"notes"\s*:\s*"[^"]+"', '"notes": "Correção do importador PDF para itens com colunas quebradas na NFC-e"', conteudo, count=1)
              version.write_text(conteudo, encoding='utf-8')
          PY

      - name: Validar JavaScript e referência
        shell: bash
        run: |
          node --check importar-nota-pdf.js
          grep -q 'const VERSAO = "1.3.3"' importar-nota-pdf.js
          grep -q 'extrairItensPorBlocosCodigoSEFMG' importar-nota-pdf.js
          grep -q 'importar-nota-pdf.js?v=1.3.3' index.html

      - name: Commit e push
        shell: bash
        run: |
          git config user.name 'ListaLar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add importar-nota-pdf.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git commit -m 'Corrige parser PDF para NFC-e com colunas quebradas'
          git push origin HEAD:main
