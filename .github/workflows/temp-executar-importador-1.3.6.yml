name: TEMP executar importador 1.3.6

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest
    if: github.head_ref == 'fix/importador-multicom-1.3.6'
    steps:
      - name: Checkout da branch de correção
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Executar patch preparado na branch
        shell: bash
        run: |
          python3 <<'RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/aplicar-importador-1.3.6.yml')
          conteudo = workflow.read_text(encoding='utf-8')

          inicio = conteudo.find("          python3 <<'PY'\n")
          fim = conteudo.find("\n          PY\n", inicio)

          if inicio < 0 or fim < 0:
              raise SystemExit('Bloco Python do patch não encontrado.')

          bloco = conteudo[inicio + len("          python3 <<'PY'\n"):fim]
          linhas = []
          for linha in bloco.splitlines():
              if linha.startswith('          '):
                  linha = linha[10:]
              linhas.append(linha)

          codigo = '\n'.join(linhas) + '\n'

          # A versão do repositório tem o mesmo código, mas a formatação
          # do bloco de itens brutos pode variar. Troca apenas essa etapa
          # por uma busca estrutural, sem depender de espaços/quebras exatas.
          inicio_bruto = codigo.find("antigo_bruto = '''")
          fim_bruto = codigo.find("chamada_antiga = '''", inicio_bruto)

          if inicio_bruto < 0 or fim_bruto < 0:
              raise SystemExit('Etapa de itens brutos não localizada no patch.')

          bruto_robusto = r'''texto, qtd_pagina = re.subn(
    r'(y:\s*\(item\.transform\?\.\[5\]\s*\?\?\s*0\)\s*-\s*\(numeroPagina\s*\*\s*100000\))',
    r'\1,\n                    pagina: numeroPagina',
    texto,
    count=1
)
if qtd_pagina != 1:
    raise SystemExit('Bloco de itens brutos não encontrado.')

'''

          codigo = (
              codigo[:inicio_bruto] +
              bruto_robusto +
              codigo[fim_bruto:]
          )

          exec(compile(codigo, 'patch-importador-1.3.6.py', 'exec'))
          RUNNER

      - name: Validar resultado
        shell: bash
        run: |
          node --check importar-nota-pdf.js
          grep -q 'const VERSAO = "1.3.6"' importar-nota-pdf.js
          grep -q 'startsWith("qtde total de itens")' importar-nota-pdf.js
          grep -q 'valorProdutosOficial = 0' importar-nota-pdf.js
          grep -q 'importar-nota-pdf.js?v=1.3.6' index.html
          grep -q '"version": "1.0.30"' version.json

      - name: Commit e push na branch
        shell: bash
        run: |
          git config user.name 'ListaLar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add importar-nota-pdf.js index.html version.json
          git commit -m 'Corrige parser MULTICOM sem regressão nas notas existentes'
          git push origin HEAD:${{ github.head_ref }}
