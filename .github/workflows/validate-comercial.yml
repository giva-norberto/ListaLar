name: Validate Comercial

on:
  pull_request:
    branches:
      - main
    paths:
      - 'comercial.js'
      - 'pwa-update.js'
      - 'firestore.rules'
      - 'version.json'
      - '.github/workflows/validate-comercial.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check comercial.js
          node --check pwa-update.js

      - name: Confirmar que Gastos permaneceu intocado
        run: |
          test "$(git hash-object gastos.js)" = "8f426b5830f6e3c46b761e42d88b4a5b9201eb07"

      - name: Validar regras do Firestore no emulador
        run: npx --yes firebase-tools emulators:exec --only firestore "echo Firestore rules OK" --project demo-listalar
