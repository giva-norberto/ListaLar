name: Validate Comercial

on:
  pull_request:
    branches:
      - main
    paths:
      - 'comercial.js'
      - 'comercial.html'
      - 'comercial-app.js'
      - 'comercial-app.txt'
      - 'comercial-contexto.js'
      - 'comercial-contexto.txt'
      - 'comercial-calculos.js'
      - 'comercial-calculos.txt'
      - 'comercial-render.js'
      - 'comercial-render.txt'
      - 'comercial-operacoes.js'
      - 'comercial-operacoes.txt'
      - 'comercial-main.js'
      - 'comercial-main.txt'
      - 'comercial-venda-ui.js'
      - 'comercial-venda-ui.txt'
      - 'comercial-dashboard-ui.js'
      - 'comercial-dashboard-ui.txt'
      - 'comercial-dashboard-periodo.js'
      - 'comercial-dashboard-periodo.txt'
      - 'comercial-relatorios.js'
      - 'comercial-relatorios.txt'
      - 'comercial-campos-numericos.js'
      - 'comercial-campos-numericos.txt'
      - 'comercial-produto-form.js'
      - 'comercial-produto-form.txt'
      - 'comercial-produtos-ui.js'
      - 'comercial-produtos-ui.txt'
      - 'comercial-edicao-inline.js'
      - 'comercial-edicao-inline.txt'
      - 'comercial-compacto.js'
      - 'comercial-compacto.txt'
      - 'comercial-menu-ui.js'
      - 'comercial-menu-ui.txt'
      - 'comercial-voz.js'
      - 'comercial-ajuda.js'
      - 'comercial-ajuda.txt'
      - 'admin-comercial.html'
      - 'admin-comercial.js'
      - 'pwa-update.js'
      - 'login-navegador.js'
      - 'version.json'
      - '.github/workflows/validate-comercial.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check comercial.js
          node --check comercial-app.js
          node --check comercial-contexto.js
          node --check comercial-calculos.js
          node --check comercial-render.js
          node --check comercial-operacoes.js
          node --check comercial-main.js
          node --check comercial-venda-ui.js
          node --check comercial-dashboard-ui.js
          node --check comercial-dashboard-periodo.js
          node --check comercial-relatorios.js
          node --check comercial-campos-numericos.js
          node --check comercial-produto-form.js
          node --check comercial-produtos-ui.js
          node --check comercial-edicao-inline.js
          node --check comercial-compacto.js
          node --check comercial-menu-ui.js
          node --check comercial-voz.js
          node --check comercial-ajuda.js
          node --check admin-comercial.js
          node --check pwa-update.js
          node --check login-navegador.js

      - name: Confirmar cópias TXT do Comercial
        run: |
          cmp -s comercial-app.js comercial-app.txt
          cmp -s comercial-contexto.js comercial-contexto.txt
          cmp -s comercial-calculos.js comercial-calculos.txt
          cmp -s comercial-render.js comercial-render.txt
          cmp -s comercial-operacoes.js comercial-operacoes.txt
          cmp -s comercial-main.js comercial-main.txt
          cmp -s comercial-venda-ui.js comercial-venda-ui.txt
          cmp -s comercial-dashboard-ui.js comercial-dashboard-ui.txt
          cmp -s comercial-dashboard-periodo.js comercial-dashboard-periodo.txt
          cmp -s comercial-relatorios.js comercial-relatorios.txt
          cmp -s comercial-campos-numericos.js comercial-campos-numericos.txt
          cmp -s comercial-produto-form.js comercial-produto-form.txt
          cmp -s comercial-produtos-ui.js comercial-produtos-ui.txt
          cmp -s comercial-edicao-inline.js comercial-edicao-inline.txt
          cmp -s comercial-compacto.js comercial-compacto.txt
          cmp -s comercial-menu-ui.js comercial-menu-ui.txt
          cmp -s comercial-ajuda.js comercial-ajuda.txt

      - name: Confirmar separação do Comercial
        run: |
          grep -q 'window.location.href = PAGINA_COMERCIAL' comercial.js
          grep -q 'comercial_produtos' comercial-contexto.js
          grep -q 'comercial_movimentos' comercial-contexto.js
          grep -q 'Módulos → Comercial' admin-comercial.html
          grep -q 'comercial-campos-numericos.js?v=1.2.2' comercial-app.js
          grep -q 'comercial-dashboard-ui.js?v=1.3.12' comercial-app.js
          grep -q 'comercial-produto-form.js?v=1.3.0' comercial-app.js
          grep -q 'comercial-produtos-ui.js?v=1.3.8' comercial-app.js
          grep -q 'comercial-edicao-inline.js?v=1.3.0' comercial-app.js
          grep -q 'comercial-compacto.js?v=1.2.4' comercial-app.js
          grep -q 'comercial-menu-ui.js?v=1.3.15' comercial-app.js
          grep -q 'comercial-relatorios.js?v=1.3.12' comercial-app.js
          grep -q 'comercial-main.js?v=1.3.11' comercial-app.js
          grep -q 'comercial-render.js?v=1.3.3' comercial-main.js
          grep -q 'comercial-venda-ui.js?v=1.3.4' comercial-main.js
          grep -q 'comercial-produtos-ui.js?v=1.3.8' comercial-main.js
          grep -q 'comercial-dashboard-periodo.js?v=1.3.9' comercial-main.js

      - name: Confirmar cadastro, edição e exclusão de produto
        run: |
          grep -q 'data-editar-produto' comercial-render.js
          grep -q 'data-editar-movimento' comercial-render.js
          grep -q 'comercial-produto-descricao' comercial-render.js
          grep -q 'Unidade:' comercial-render.js
          grep -q 'Estoque atual:' comercial-render.js
          grep -q 'prepararDescricaoLivre' comercial-produto-form.js
          grep -q 'produtoUnidade' comercial-produto-form.js
          grep -q 'textarea.style.cssText' comercial-produto-form.js
          grep -q 'grid-template-columns:minmax(0,1fr) 136px' comercial-produtos-ui.js
          grep -q 'grid-template-areas:"titulo acao" "meta meta" "valores valores"' comercial-produtos-ui.js
          grep -q '#listaProdutos .comercial-produto-acoes' comercial-produtos-ui.js
          grep -q '#listaProdutos .values' comercial-produtos-ui.js
          grep -q 'comercial-produto-meta>span:first-child' comercial-produtos-ui.js
          grep -q 'font-size:24px!important' comercial-produtos-ui.js
          grep -q 'font-size:15px!important' comercial-produtos-ui.js
          grep -q 'word-break:break-word' comercial-produtos-ui.js
          grep -q 'custo.textContent = "Custo unitário"' comercial-produtos-ui.js
          grep -q 'data-excluir-produto' comercial-produtos-ui.js
          grep -q 'comercial-btn-excluir' comercial-produtos-ui.js
          grep -q 'Zere o estoque antes de excluir' comercial-produtos-ui.js
          grep -q 'ativo: false' comercial-produtos-ui.js
          grep -q 'excluidoEm: serverTimestamp()' comercial-produtos-ui.js
          grep -q 'garantirAcoesProdutos();' comercial-main.js
          grep -q 'data-modal-descricao' comercial-edicao-inline.js
          grep -q 'data-modal-unidade' comercial-edicao-inline.js
          grep -q 'data-modal-salvar' comercial-edicao-inline.js
          grep -q 'data-modal-cancelar' comercial-edicao-inline.js
          grep -q 'min-height:44px!important' comercial-edicao-inline.js
          grep -q 'evento.stopImmediatePropagation' comercial-edicao-inline.js
          grep -q 'tipo: "ajuste"' comercial-edicao-inline.js
          ! grep -q 'MutationObserver' comercial-contexto.js comercial-calculos.js comercial-render.js comercial-operacoes.js comercial-main.js comercial-venda-ui.js comercial-dashboard-ui.js comercial-dashboard-periodo.js comercial-relatorios.js comercial-campos-numericos.js comercial-produto-form.js comercial-produtos-ui.js comercial-edicao-inline.js comercial-compacto.js comercial-menu-ui.js

      - name: Confirmar Dashboard financeiro e custo líquido
        run: |
          grep -q 'Evolução do negócio' comercial-render.js
          grep -q 'comercial-dashboard-grafico' comercial-render.js
          grep -q 'Faturamento' comercial-render.js
          grep -q 'Resultado' comercial-render.js
          grep -q 'kpiEstoqueCusto' comercial-render.js
          grep -q 'kpiEstoqueVenda' comercial-render.js
          grep -q 'closest(".kpi")?.remove()' comercial-render.js
          grep -q 'ocultarCustoVendido' comercial-dashboard-ui.js
          grep -q 'getElementById("kpiCusto")' comercial-dashboard-ui.js
          grep -q 'card.hidden = true' comercial-dashboard-ui.js
          grep -q 'configurarCustoLiquido' comercial-dashboard-ui.js
          grep -q 'Custo líquido' comercial-dashboard-ui.js
          grep -q 'Compras de produtos + despesas no período' comercial-dashboard-ui.js
          grep -q 'periodoDashboardInicio' comercial-dashboard-periodo.js
          grep -q 'periodoDashboardFim' comercial-dashboard-periodo.js
          grep -q 'type="date"' comercial-dashboard-periodo.js
          grep -q 'data >= ESTADO.dataInicioDashboard && data <= ESTADO.dataFimDashboard' comercial-dashboard-periodo.js
          grep -q 'const compras = movs.filter((m) => m.tipo === "compra")' comercial-dashboard-periodo.js
          grep -q 'const totalCompras = compras.reduce' comercial-dashboard-periodo.js
          grep -q 'const custoLiquido = moeda(totalCompras + desp)' comercial-dashboard-periodo.js
          grep -q '\$("kpiDespesas").textContent = fmtMoeda(custoLiquido)' comercial-dashboard-periodo.js
          grep -q 'Gráfico diário de faturamento, custo líquido e resultado' comercial-dashboard-periodo.js
          grep -q 'pontosSerie(dados, "custoLiquido"' comercial-dashboard-periodo.js
          grep -q 'renderDashboardPorDatas();' comercial-main.js
          grep -q 'selectAntigo.replaceWith(area)' comercial-dashboard-periodo.js
          ! grep -q '\$("dashboardProdutos").innerHTML = lista' comercial-render.js

      - name: Confirmar relatórios de vendas e compras
        run: |
          grep -q 'botao.dataset.tela = "relatorios"' comercial-relatorios.js
          grep -q 'historicoBtn.before(botao)' comercial-relatorios.js
          grep -q 'tela-relatorios' comercial-relatorios.js
          grep -q 'relatorioDataInicio' comercial-relatorios.js
          grep -q 'relatorioDataFim' comercial-relatorios.js
          grep -q 'data-relatorio-tipo="venda"' comercial-relatorios.js
          grep -q 'data-relatorio-tipo="compra"' comercial-relatorios.js
          grep -q 'm.tipo === tipoAtual' comercial-relatorios.js
          grep -q 'Faturamento' comercial-relatorios.js
          grep -q 'Custo das vendas' comercial-relatorios.js
          grep -q 'Lucro bruto' comercial-relatorios.js
          grep -q 'Total em compras' comercial-relatorios.js
          grep -q 'Exportar CSV' comercial-relatorios.js
          grep -q 'new Blob' comercial-relatorios.js
          grep -q 'text/csv;charset=utf-8' comercial-relatorios.js

      - name: Confirmar menu, telas e datas mobile estáveis
        run: |
          grep -q '@media (min-width: 900px)' comercial-menu-ui.js
          grep -q 'flex: 1 1 0 !important' comercial-menu-ui.js
          grep -q '@media (max-width: 899px)' comercial-menu-ui.js
          grep -q 'overflow-x: auto !important' comercial-menu-ui.js
          grep -q 'html, body' comercial-menu-ui.js
          grep -q 'overflow-x: hidden' comercial-menu-ui.js
          grep -q '#periodoDashboardDatas' comercial-menu-ui.js
          grep -q 'grid-template-columns: minmax(0,1fr) minmax(0,1fr) !important' comercial-menu-ui.js
          grep -q '.comercial-data-compacta' comercial-menu-ui.js
          grep -q 'formatarDataIsoCompleta' comercial-menu-ui.js
          grep -q 'opacity: .01 !important' comercial-menu-ui.js
          grep -q '.comercial-grafico-wrap' comercial-menu-ui.js
          grep -q 'overflow-x: hidden !important' comercial-menu-ui.js
          grep -q '#tela-relatorios .comercial-relatorio-filtros' comercial-menu-ui.js
          grep -q 'overscroll-behavior-x: contain' comercial-menu-ui.js

      - name: Confirmar estorno seguro de compra, venda e despesa
        run: |
          grep -q 'data-estornar-movimento' comercial-main.js
          grep -q 'TIPOS_ESTORNAVEIS = new Set(\["compra", "venda", "despesa"\])' comercial-main.js
          grep -q 'Estornar esta compra?' comercial-main.js
          grep -q 'Estornar esta venda?' comercial-main.js
          grep -q 'Estornar esta despesa?' comercial-main.js
          grep -q 'adicionarBotoesEstorno("listaDespesas", "despesa")' comercial-main.js
          grep -q 'tipo: "estorno"' comercial-main.js
          grep -q 'tipoOriginal: atual.tipo' comercial-main.js
          grep -q 'estornado: true' comercial-main.js
          grep -q 'estornadoEm: serverTimestamp()' comercial-main.js
          grep -q 'aplicarRecalculoNaTransacao(tx, plano)' comercial-main.js
          grep -q 'Despesa estornada' comercial-main.js
          grep -q 'Histórico preservado' comercial-main.js
          grep -q 'garantirAcoesMovimentos();' comercial-main.js

      - name: Confirmar Estoque compacto
        run: |
          grep -q 'comercial-estoque-resumo' comercial-render.js
          grep -q 'Valor em estoque (custo)' comercial.html
          grep -q 'estoqueValorCusto' comercial.html
          grep -q 'valorEstoqueCusto = lista.reduce' comercial-render.js
          grep -q 'comercial-estoque-card' comercial-render.js
          grep -q 'comercial-estoque-produto' comercial-render.js
          grep -q 'comercial-estoque-qtd' comercial-render.js
          grep -q 'Qtd: ${fmtNumero(estoque)}' comercial-render.js
          grep -q 'estoque <= 0 ? "zerado" : estoque <= 3 ? "baixo" : "ok"' comercial-render.js
          grep -q 'border-left:7px solid #16a34a' comercial-render.js
          grep -q 'border-left-color:#f59e0b' comercial-render.js
          grep -q 'border-left-color:#dc2626' comercial-render.js
          grep -q '\$("listaEstoque").innerHTML = htmlEstoqueLista' comercial-render.js
          ! grep -q '<h2>Estoque comercial</h2>' comercial.html

      - name: Confirmar venda simplificada
        run: |
          grep -q '<label>Saldo</label><input id="vendaSaldo"' comercial.html
          grep -q '<label>Qtd.</label><input id="vendaQtd"' comercial.html
          grep -q 'preencherSelect("compraProduto", opcoes)' comercial-venda-ui.js
          grep -q 'preencherSelect("vendaProduto", opcoes)' comercial-venda-ui.js
          grep -q 'labelQtd.textContent = "Qtd."' comercial-venda-ui.js
          grep -q '<label for="vendaSaldo">Saldo</label>' comercial-venda-ui.js
          grep -q 'id="vendaSaldo"' comercial-venda-ui.js
          grep -q 'readonly tabindex="-1"' comercial-venda-ui.js
          grep -q 'produto ? fmtNumero(produto.estoque)' comercial-venda-ui.js
          grep -q 'normalizarSeletoresProdutos();' comercial-main.js
          grep -q 'fmtCampoMoeda(p.precoVenda)' comercial-operacoes.js
          ! grep -q 'estoque ${fmtNumero' comercial-venda-ui.js

      - name: Confirmar valores numéricos com vírgula
        run: |
          grep -q 'inputmode="decimal"' comercial.html
          grep -q 'campo.type = "text"' comercial-campos-numericos.js
          grep -q 'campo.inputMode = "decimal"' comercial-campos-numericos.js
          grep -q 'limitarCasasDigitadas' comercial-campos-numericos.js
          grep -q 'dataset.decimalPtBr' comercial-campos-numericos.js
          grep -q 'pattern", "\[0-9.,\]\*"' comercial-campos-numericos.js
          grep -q 'numeroDigitado' comercial-produto-form.js
          grep -q 'numeroDigitado' comercial-edicao-inline.js
          ! grep -q 'HTMLInputElement.prototype' comercial-campos-numericos.js
          ! grep -q 'campo.type = "number"' comercial-campos-numericos.js

      - name: Confirmar visual limpo e compacto do Comercial
        run: |
          grep -q 'comercial-app.js?v=1.3.4' comercial.html
          grep -q 'font-size:27px' comercial.html
          grep -q 'linear-gradient(135deg,#eff6ff,#fff)' comercial.html
          grep -q '.manual-hint,.comercial-edicao-info{display:none!important}' comercial.html
          grep -q 'padding:11px!important' comercial-compacto.js
          grep -q 'margin-top:8px!important' comercial-compacto.js
          grep -q 'min-height:44px!important' comercial-compacto.js
          ! grep -q '<p class="manual-hint">' comercial.html
          ! grep -q 'Cadastro comercial ativo' comercial.html
          ! grep -q 'Todos os valores podem ser digitados manualmente' comercial.html

      - name: Confirmar proteção do login Google
        run: |
          grep -q 'login-navegador.js?v=1.0.0' pwa-update.js
          grep -q '#btnLoginGoogle' login-navegador.js
          grep -q 'TeamsMobile' login-navegador.js
          grep -q 'Abrir no Safari' login-navegador.js
          grep -q 'Abrir no Chrome' login-navegador.js
          grep -q 'stopImmediatePropagation' login-navegador.js
          grep -q 'sessionStorageDisponivel' login-navegador.js
          grep -q 'display-mode: standalone' login-navegador.js

      - name: Confirmar manual do Comercial existente
        run: |
          grep -q 'btnAjudaComercial' comercial.html
          grep -q 'Manual do Comercial' comercial-ajuda.js
          cmp -s comercial-ajuda.js comercial-ajuda.txt

      - name: Confirmar versão nova
        run: |
          grep -q '"version": "1.0.59"' version.json

      - name: Confirmar que Gastos permaneceu intocado
        run: |
          test "$(git hash-object gastos.js)" = "8f426b5830f6e3c46b761e42d88b4a5b9201eb07"
