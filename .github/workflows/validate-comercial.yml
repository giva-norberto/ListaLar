name: Validate Comercial

on:
  pull_request:
    branches:
      - main
    paths:
      - 'comercial.js'
      - 'comercial.html'
      - 'comercial-app.js'
      - 'admin-comercial.html'
      - 'admin-comercial.js'
      - 'version.json'
      - '.github/workflows/validate-comercial.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check comercial.js
          node --check comercial-app.js
          node --check admin-comercial.js
          node --check pwa-update.js

      - name: Confirmar separação do Comercial
        run: |
          grep -q 'window.location.href = PAGINA_COMERCIAL' comercial.js
          grep -q 'comercial_produtos' comercial-app.js
          grep -q 'comercial_movimentos' comercial-app.js
          grep -q 'Módulos → Comercial' admin-comercial.html

      - name: Confirmar que Gastos permaneceu intocado
        run: |
          test "$(git hash-object gastos.js)" = "8f426b5830f6e3c46b761e42d88b4a5b9201eb07"
